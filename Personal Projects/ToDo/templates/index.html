{% extends "base.html" %}
{% block title %}Home Page {% endblock %}

{% block content %}
<h1>To Do</h1>

{% for message in get_flashed_messages() %}
<p>{{message}}</p>
{% endfor %}



<form method="post">
    <p>Enter task: <input type="text" name="task"></p>
    <p id="submit-btn"><input type="submit"></p>
</form>

<ul>
{% for task in tasks %}

    <li class="task-item">{{ task.content }} <a class="delete-link" href="{{url_for('delete', index = task.id)}}">Delete</a></li>

{% endfor %}
</ul>
{% endblock %}
