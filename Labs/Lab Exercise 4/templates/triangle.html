{% extends "base.html" %}

{% block title %}Area of Triangle{% endblock %}

{% block content %}

<div class="page-heading text-center">
    <h1>Area of a Triangle</h1>
    <p>Calculate the area using the base and height.</p>
    <div class="heading-line mx-auto"></div>
</div>

{% if result %}
<div class="result-display text-center mb-5">
    <span class="result-label">Calculated Area</span>
    <div class="result-value">
        {{ result }}
    </div>
</div>
{% endif %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <div class="shape-icon">
                        <i class="bi bi-triangle"></i>
                    </div>
                </div>

                <form
                    action="/works/area/triangle"
                    method="post"
                >

                    <div class="mb-3">

                        <label
                            for="base"
                            class="form-label"
                        >
                            Base
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="base"
                            name="base"
                            class="form-control"
                            placeholder="Enter base..."
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="height"
                            class="form-label"
                        >
                            Height
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="height"
                            name="height"
                            class="form-control"
                            placeholder="Enter height..."
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Calculate Area
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
